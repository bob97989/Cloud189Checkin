name: Cloud check in

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 10:35 Asia/Shanghai
    - cron: "35 2 * * *"

permissions:
  contents: write

concurrency:
  group: cloud189-checkin
  cancel-in-progress: false

jobs:
  check-in:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: user
    env:
      TY_USERNAME_1: ${{ secrets.TY_USERNAME_1 }}
      TY_PASSWORD_1: ${{ secrets.TY_PASSWORD_1 }}
      TY_USERNAME_2: ${{ secrets.TY_USERNAME_2 }}
      TY_PASSWORD_2: ${{ secrets.TY_PASSWORD_2 }}
      TY_USERNAME_3: ${{ secrets.TY_USERNAME_3 }}
      TY_PASSWORD_3: ${{ secrets.TY_PASSWORD_3 }}
      CLOUD189_VERBOSE: ${{ vars.CLOUD189_VERBOSE || '0' }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate credentials
        run: |
          if [ -z "$TY_USERNAME_1" ] || [ -z "$TY_PASSWORD_1" ]; then
            echo "::error::Set TY_USERNAME_1 and TY_PASSWORD_1 in the 'user' environment."
            exit 1
          fi

      - name: Compute account cache key
        id: account
        run: |
          ACCOUNT_HASH=$(printf '%s' "$TY_USERNAME_1" | sha256sum | cut -d' ' -f1)
          echo "hash=$ACCOUNT_HASH" >> "$GITHUB_OUTPUT"

      - name: Restore cached login token
        uses: actions/cache/restore@v4
        with:
          path: .token
          key: cloud189-token-${{ steps.account.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            cloud189-token-${{ steps.account.outputs.hash }}-

      - name: Install dependencies
        run: npx --yes yarn@1.22.22 install --frozen-lockfile

      - name: Check JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check accounts.js

      - name: Run check-in
        run: npm start

      - name: Compute token cache key
        id: token
        if: always()
        run: |
          if find .token -type f -name '*.json' -print -quit 2>/dev/null | grep -q .; then
            TOKEN_HASH=$(find .token -type f -name '*.json' -exec sha256sum {} \; | sha256sum | cut -d' ' -f1)
            echo "hash=$TOKEN_HASH" >> "$GITHUB_OUTPUT"
          fi

      - name: Save cached login token
        if: always() && steps.token.outputs.hash != ''
        uses: actions/cache/save@v4
        with:
          path: .token
          key: cloud189-token-${{ steps.account.outputs.hash }}-${{ steps.token.outputs.hash }}-${{ github.run_id }}

      - name: Keep the scheduled workflow active
        if: success() && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git commit --allow-empty -m "Keep Running..."
          git push origin HEAD:main
